<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal Oficial — Reality</title>
<meta name="description" content="Portal oficial do reality: edições, elenco, paredões, notícias e acontecimentos.">
<style>
:root{
  --bg:#070810;--panel:#101321;--panel2:#171a2a;--panel3:#1d2133;
  --text:#f8f8fc;--muted:#a9aec0;--line:#2a3046;
  --accent:#a855f7;--accent2:#ec4899;--good:#46d78b;--danger:#ff5f7a;
  --radius:24px;--shadow:0 20px 60px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%),
 radial-gradient(800px 500px at 100% 5%,color-mix(in srgb,var(--accent2) 18%,transparent),transparent 62%),
 var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
img{max-width:100%}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:100;background:rgba(7,8,16,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brandIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 30%,transparent);font-size:21px}
.brandText{min-width:0}.brandText b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandText small{color:var(--muted)}
.iconBtn,.ghost{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:14px;padding:10px 12px}
.iconBtn{width:44px;height:44px}
.container{max-width:1200px;margin:auto;padding:18px 16px 80px}
.hero{position:relative;overflow:hidden;min-height:410px;border:1px solid var(--line);border-radius:32px;background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:end}
.heroMedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}
.heroShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,12,.94) 0%,rgba(5,6,12,.68) 42%,rgba(5,6,12,.18) 100%),linear-gradient(0deg,rgba(5,6,12,.9),transparent 65%)}
.heroContent{position:relative;padding:34px;max-width:760px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:900;color:#e9e9f2}
h1{font-size:clamp(42px,8vw,82px);line-height:.92;margin:10px 0 16px;letter-spacing:-.04em}
h2{font-size:28px;margin:0 0 14px}h3{margin:0 0 8px}
.lead{font-size:18px;line-height:1.55;color:#d4d7e2}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.primary,.secondary,.danger{border-radius:15px;padding:13px 17px;font-weight:850;border:1px solid transparent}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 25%,transparent)}
.secondary{background:var(--panel2);border-color:var(--line);color:#fff}.danger{background:#32141d;border-color:#66303e;color:#ffbdc8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:15px}
.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}
.section{margin-top:30px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.sectionHead p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 14px;border-radius:999px;font-weight:800}.tab.active{color:#fff;background:color-mix(in srgb,var(--accent) 20%,var(--panel));border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:linear-gradient(180deg,var(--panel),#0e111c);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.span6{grid-column:span 6}.span4{grid-column:span 4}.span8{grid-column:span 8}
.contentGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.contentCard{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.contentImage{height:180px;width:100%;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.contentBody{padding:16px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.08);color:#e9e9f2}.meta{color:var(--muted);font-size:13px}.contentBody p{color:#c7cad6;line-height:1.5;margin:8px 0 0}.contentActions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.castGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.person{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--panel)}.person img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#20243a}.personBody{padding:12px}.personBody b{display:block}.personBody small{color:var(--muted)}
.role{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:#eee}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}
.drawerBackdrop,.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;display:none}.drawerBackdrop.open,.modalBackdrop.open{display:block}
.drawer{position:absolute;right:0;top:0;height:100%;width:min(430px,94vw);background:#0d101b;border-left:1px solid var(--line);padding:18px;overflow:auto}
.drawerHead,.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.drawerHead h2,.modalHead h2{margin:0}
.adminNav{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.adminTab{white-space:nowrap;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}.adminTab.active{color:#fff;border-color:var(--accent)}
.form{display:grid;gap:13px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:850;color:#dfe2ec}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0a0d16;color:#fff;border-radius:14px;padding:12px 13px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colorRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.colorPicker{width:58px;height:44px;padding:3px;border-radius:12px;border:1px solid var(--line);background:#0a0d16}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.filePreview{width:100%;max-height:180px;object-fit:cover;border-radius:16px;border:1px solid var(--line);margin-top:7px}.check{display:flex;align-items:center;gap:8px;color:#d9dce7;font-size:13px}.check input{width:auto}
.listItem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.listItem:last-child{border-bottom:0}.thumb{width:54px;height:54px;border-radius:14px;object-fit:cover;background:#22263a}.liText{flex:1;min-width:0}.liText b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.liText small{color:var(--muted)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:90vh;overflow:auto;background:#0d101b;border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:500;background:#f7f7fb;color:#11131b;padding:12px 16px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);display:none}.toast.show{display:block}
.small{font-size:12px;color:var(--muted)}.notice{padding:13px 14px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-radius:16px;color:#dfe2ec;line-height:1.45}
@media(max-width:900px){.contentGrid{grid-template-columns:repeat(2,1fr)}.castGrid{grid-template-columns:repeat(3,1fr)}.span6,.span4,.span8{grid-column:span 12}}
@media(max-width:620px){.container{padding:12px 12px 55px}.nav{padding:10px 12px}.hero{min-height:470px;border-radius:25px}.heroContent{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.contentGrid{grid-template-columns:1fr}.castGrid{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.sectionHead{align-items:start;flex-direction:column}.brandText small{display:none}.card{padding:16px}}
</style>
</head>
<body>
<div class="top">
  <div class="nav">
    <div class="brand">
      <div class="brandIcon">🎬</div>
      <div class="brandText"><b id="brandName">Portal Oficial</b><small id="brandEdition">Reality</small></div>
    </div>
    <button class="iconBtn" onclick="openAdmin()" aria-label="Área do criador">⚙️</button>
    <button class="iconBtn" onclick="openMenu()" aria-label="Menu">☰</button>
  </div>
</div>

<main class="container">
  <section class="hero" id="hero"></section>

  <div class="stats" id="stats"></div>

  <section class="section">
    <div class="sectionHead">
      <div><h2>Conteúdo da edição</h2><p>Veja o que está acontecendo no reality.</p></div>
      <button class="secondary" onclick="scrollToId('content')">Ver tudo</button>
    </div>
    <div class="tabs" id="publicFilters"></div>
    <div id="content"></div>
  </section>

  <section class="section" id="castSection">
    <div class="sectionHead"><div><h2>Elenco</h2><p>Participantes da edição atual.</p></div></div>
    <div id="cast"></div>
  </section>

  <footer class="footer">Portal oficial • criado para seu reality • <span id="year"></span></footer>
</main>

<div class="drawerBackdrop" id="drawerBackdrop" onclick="closeDrawer(event)">
  <aside class="drawer" onclick="event.stopPropagation()">
    <div class="drawerHead"><h2>☰ Menu</h2><button class="iconBtn" onclick="closeDrawer()">✕</button></div>
    <div id="editionMenu"></div>
    <div class="notice">O Portal é separado da Central de Votações. Os botões de votar apenas abrem o link da votação que você cadastrar.</div>
  </aside>
</div>

<div class="modalBackdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY="portal_oficial_reality_v2";
const PIN_KEY="portal_admin_pin_v2";
const defaultData={
  siteName:"Portal Oficial",
  editions:[{
    id:uid(),name:"Reality — 1ª Edição",year:"2026",description:"Acompanhe o elenco, os paredões, as notícias e todos os acontecimentos da edição.",accent:"#a855f7",accent2:"#ec4899",
    cover:"",voteUrl:"",
    cast:[
      {id:uid(),name:"Participante 01",role:"",image:"",status:"ativo"},
      {id:uid(),name:"Participante 02",role:"",image:"",status:"ativo"},
      {id:uid(),name:"Participante 03",role:"",image:"",status:"ativo"},
      {id:uid(),name:"Participante 04",role:"",image:"",status:"ativo"}
    ],
    posts:[
      {id:uid(),type:"Paredão",title:"Paredão da semana",text:"A votação está aberta. Clique para votar.",image:"",voteUrl:"",date:"",featured:true},
      {id:uid(),type:"Notícia",title:"Bem-vindos à nova edição!",text:"Confira as novidades e acompanhe tudo pelo Portal Oficial.",image:"",voteUrl:"",date:"",featured:false}
    ]
  }]
};
let data=load();
let currentEditionId=data.editions[0]?.id||null;
let currentFilter="Todos";

function uid(){return "id_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.editions?x:structuredClone(defaultData)}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){return data.editions.find(e=>e.id===currentEditionId)||data.editions[0]}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function cssColor(c){return /^#[0-9a-f]{6}$/i.test(c||"")?c:"#a855f7"}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove("show"),2200)}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"})}
function setTheme(e){document.documentElement.style.setProperty("--accent",cssColor(e.accent));document.documentElement.style.setProperty("--accent2",cssColor(e.accent2));document.getElementById("brandName").textContent=data.siteName||"Portal Oficial";document.getElementById("brandEdition").textContent=e.name||"Reality"}
function imgOrPlaceholder(src,label="Reality"){return src||`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="${cssColor(current().accent)}"/><stop offset="1" stop-color="${cssColor(current().accent2)}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial" font-size="42" font-weight="700">${esc(label)}</text></svg>`)}`}
function render(){
 const e=current(); if(!e)return;
 setTheme(e); document.getElementById("year").textContent=new Date().getFullYear();
 const hero=document.getElementById("hero");
 hero.innerHTML=`<img class="heroMedia" src="${imgOrPlaceholder(e.cover,e.name)}" alt=""><div class="heroShade"></div>
 <div class="heroContent"><div class="eyebrow">${esc(e.year||"EDIÇÃO")} • PORTAL OFICIAL</div><h1>${esc(e.name)}</h1><div class="lead">${esc(e.description||"Acompanhe tudo por aqui.")}</div>
 <div class="actions">${e.voteUrl?`<a class="primary" href="${esc(e.voteUrl)}" target="_blank" rel="noopener">🗳️ Votar agora</a>`:""}<button class="secondary" onclick="scrollToId('castSection')">👥 Ver elenco</button><button class="secondary" onclick="openAdmin()">⚙️ Criador</button></div></div>`;
 document.getElementById("stats").innerHTML=`<div class="stat"><b>${e.cast.length}</b><span>participantes</span></div><div class="stat"><b>${e.posts.filter(p=>p.type==="Paredão").length}</b><span>paredões</span></div><div class="stat"><b>${e.posts.length}</b><span>publicações</span></div><div class="stat"><b>${e.posts.filter(p=>p.type==="Notícia").length}</b><span>notícias</span></div>`;
 const types=["Todos",...new Set(e.posts.map(p=>p.type))];
 document.getElementById("publicFilters").innerHTML=types.map(t=>`<button class="tab ${currentFilter===t?"active":""}" onclick="setFilter('${esc(t)}')">${esc(t)}</button>`).join("");
 renderPosts(); renderCast();
}
function setFilter(f){currentFilter=f;render()}
function renderPosts(){
 const e=current(); const posts=e.posts.filter(p=>currentFilter==="Todos"||p.type===currentFilter);
 if(!posts.length){document.getElementById("content").innerHTML=`<div class="empty">Nenhuma publicação nessa categoria ainda.</div>`;return}
 document.getElementById("content").innerHTML=`<div class="contentGrid">${posts.map(p=>`<article class="contentCard">
 ${p.image?`<img class="contentImage" src="${esc(p.image)}" alt="">`:`<div class="contentImage"></div>`}
 <div class="contentBody"><span class="badge">${esc(p.type)}</span><h3 style="margin-top:10px">${esc(p.title)}</h3>${p.date?`<div class="meta">${esc(p.date)}</div>`:""}<p>${esc(p.text||"")}</p>
 <div class="contentActions">${p.type==="Paredão"&&p.voteUrl?`<a class="primary" href="${esc(p.voteUrl)}" target="_blank" rel="noopener">🗳️ Votar</a>`:""}<button class="secondary" onclick="openPost('${p.id}')">Abrir</button></div></div></article>`).join("")}</div>`;
}
function renderCast(){
 const e=current();
 if(!e.cast.length){document.getElementById("cast").innerHTML=`<div class="empty">Nenhum participante cadastrado ainda.</div>`;return}
 document.getElementById("cast").innerHTML=`<div class="castGrid">${e.cast.map(p=>`<article class="person" style="${p.status==="eliminado"?"opacity:.62;filter:grayscale(1)":""}">
 <img src="${imgOrPlaceholder(p.image,p.name)}" alt="${esc(p.name)}"><div class="personBody"><b>${esc(p.name)}</b><small>${p.status==="eliminado"?"Eliminado":"No jogo"}</small>${p.role?`<span class="role">${esc(p.role)}</span>`:""}</div></article>`).join("")}</div>`;
}
function openPost(id){
 const p=current().posts.find(x=>x.id===id); if(!p)return;
 document.getElementById("modal").innerHTML=`<div class="modalHead"><h2>${esc(p.title)}</h2><button class="iconBtn" onclick="closeModal()">✕</button></div>${p.image?`<img class="filePreview" src="${esc(p.image)}" alt="">`:""}<p class="meta">${esc(p.type)}${p.date?" • "+esc(p.date):""}</p><p class="lead" style="font-size:16px">${esc(p.text||"")}</p>${p.type==="Paredão"&&p.voteUrl?`<a class="primary" href="${esc(p.voteUrl)}" target="_blank" rel="noopener">🗳️ Abrir votação</a>`:""}`;
 openModal();
}
function openMenu(){
 document.getElementById("editionMenu").innerHTML=`<h3>Edições</h3>${data.editions.map(e=>`<button class="secondary" style="width:100%;margin:5px 0;text-align:left" onclick="selectEdition('${e.id}')">${esc(e.name)} <small>(${esc(e.year)})</small></button>`).join("")}`;
 document.getElementById("drawerBackdrop").classList.add("open");
}
function closeDrawer(e){if(!e||e.target.id==="drawerBackdrop")document.getElementById("drawerBackdrop").classList.remove("open")}
function selectEdition(id){currentEditionId=id;currentFilter="Todos";closeDrawer();render();window.scrollTo({top:0,behavior:"smooth"})}
function openModal(){document.getElementById("modalBackdrop").classList.add("open")}
function closeModal(e){if(!e||e.target.id==="modalBackdrop")document.getElementById("modalBackdrop").classList.remove("open")}
function openAdmin(){
 document.getElementById("modal").innerHTML=`<div class="modalHead"><h2>⚙️ Área do criador</h2><button class="iconBtn" onclick="closeModal()">✕</button></div>
 <div class="notice">Tudo aqui fica salvo neste navegador. Para publicar um portal com dados compartilhados entre aparelhos, depois podemos ligar esta estrutura ao Firebase.</div>
 <div class="form" style="margin-top:15px"><div class="field"><label>PIN do criador</label><input id="pinInput" type="password" inputmode="numeric" placeholder="Digite seu PIN"></div><button class="primary" onclick="checkPin()">Entrar no painel</button><div class="small">PIN inicial do protótipo: 1234. Troque-o depois dentro do painel.</div></div>`;
 openModal();
}
function checkPin(){const pin=document.getElementById("pinInput").value;const saved=localStorage.getItem(PIN_KEY)||"1234";if(pin===saved){openDashboard()}else toast("PIN incorreto")}
function openDashboard(){
 document.getElementById("modal").innerHTML=`<div class="modalHead"><h2>🎛️ Painel do criador</h2><button class="iconBtn" onclick="closeModal()">✕</button></div>
 <div class="adminNav"><button class="adminTab active" onclick="adminEditions()">Edições</button><button class="adminTab" onclick="adminCast()">Elenco</button><button class="adminTab" onclick="adminPosts()">Conteúdo</button><button class="adminTab" onclick="adminLook()">Aparência</button></div><div id="adminBody"></div>`;
 adminEditions(); openModal();
}
function adminEditions(){
 const e=current();
 document.getElementById("adminBody").innerHTML=`<div class="actions"><button class="primary" onclick="newEdition()">＋ Criar edição</button></div>
 <div style="margin-top:12px">${data.editions.map(x=>`<div class="listItem"><div class="liText"><b>${esc(x.name)}</b><small>${esc(x.year)} • ${x.cast.length} participantes • ${x.posts.length} publicações</small></div><button class="ghost" onclick="editEdition('${x.id}')">Editar</button><button class="danger" onclick="deleteEdition('${x.id}')">Excluir</button></div>`).join("")}</div>`;
}
function editionForm(e){
 const isNew=!e;
 document.getElementById("adminBody").innerHTML=`<div class="form">
 <div class="row2"><div class="field"><label>Nome da edição</label><input id="fName" value="${esc(e?.name||"Nova Edição")}"></div><div class="field"><label>Ano</label><input id="fYear" value="${esc(e?.year||new Date().getFullYear())}"></div></div>
 <div class="field"><label>Descrição</label><textarea id="fDesc">${esc(e?.description||"")}</textarea></div>
 <div class="field"><label>Imagem de capa</label><input id="fCover" type="file" accept="image/*" onchange="previewFile(this,'coverPreview')">${e?.cover?`<img id="coverPreview" class="filePreview" src="${esc(e.cover)}">`:`<img id="coverPreview" class="filePreview hidden">`}</div>
 <div class="field"><label>Link geral da votação (opcional)</label><input id="fVote" type="url" value="${esc(e?.voteUrl||"")}" placeholder="https://..."></div>
 <div class="row2"><div class="field"><label>Cor principal</label><div class="colorRow"><input id="fAccent" class="colorPicker" type="color" value="${cssColor(e?.accent)}"><div class="swatches">${["#a855f7","#ec4899","#3b82f6","#06b6d4","#22c55e","#f59e0b","#ef4444","#f8fafc"].map(c=>`<button class="swatch" style="background:${c}" onclick="document.getElementById('fAccent').value='${c}'"></button>`).join("")}</div></div></div>
 <div class="field"><label>Cor secundária</label><input id="fAccent2" class="colorPicker" type="color" value="${cssColor(e?.accent2||"#ec4899")}"></div></div>
 <div class="actions"><button class="primary" onclick="saveEdition('${e?.id||""}')">Salvar edição</button><button class="secondary" onclick="adminEditions()">Cancelar</button></div>
 </div>`;
}
async function previewFile(input,target){
 const f=input.files?.[0]; if(!f)return; const r=new FileReader();r.onload=()=>{const el=document.getElementById(target);el.src=r.result;el.classList.remove("hidden");el.dataset.value=r.result};r.readAsDataURL(f)
}
async function fileToData(input){return new Promise(res=>{const f=input?.files?.[0];if(!f)return res("");const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
async function saveEdition(id){
 const old=id?data.editions.find(x=>x.id===id):null; const cover=await fileToData(document.getElementById("fCover"));
 const e=old||{id:uid(),cast:[],posts:[]};e.name=document.getElementById("fName").value.trim()||"Nova Edição";e.year=document.getElementById("fYear").value.trim();e.description=document.getElementById("fDesc").value.trim();e.voteUrl=document.getElementById("fVote").value.trim();e.accent=document.getElementById("fAccent").value;e.accent2=document.getElementById("fAccent2").value;if(cover)e.cover=cover;
 if(!old)data.editions.push(e);currentEditionId=e.id;save();toast("Edição salva!");render();adminEditions()
}
function newEdition(){editionForm(null)}
function editEdition(id){editionForm(data.editions.find(x=>x.id===id))}
function deleteEdition(id){if(data.editions.length===1)return toast("Mantenha pelo menos uma edição.");if(!confirm("Excluir esta edição?"))return;data.editions=data.editions.filter(e=>e.id!==id);currentEditionId=data.editions[0].id;save();render();adminEditions()}
function adminCast(){
 const e=current();document.getElementById("adminBody").innerHTML=`<div class="actions"><button class="primary" onclick="newPerson()">＋ Adicionar participante</button></div><div style="margin-top:10px">${e.cast.map(p=>`<div class="listItem"><img class="thumb" src="${imgOrPlaceholder(p.image,p.name)}"><div class="liText"><b>${esc(p.name)}</b><small>${esc(p.role||"Sem função")} • ${p.status==="eliminado"?"Eliminado":"No jogo"}</small></div><button class="ghost" onclick="editPerson('${p.id}')">Editar</button><button class="danger" onclick="deletePerson('${p.id}')">Excluir</button></div>`).join("")||`<div class="empty">Ainda não há participantes.</div>`}</div>`;
}
function personForm(p){
 document.getElementById("adminBody").innerHTML=`<div class="form"><div class="field"><label>Nome do participante</label><input id="pName" value="${esc(p?.name||"")}"></div>
 <div class="field"><label>Função / destaque</label><input id="pRole" value="${esc(p?.role||"")}" placeholder="Líder, Anjo, etc."></div>
 <div class="field"><label>Status</label><select id="pStatus"><option value="ativo" ${p?.status!=="eliminado"?"selected":""}>No jogo</option><option value="eliminado" ${p?.status==="eliminado"?"selected":""}>Eliminado</option></select></div>
 <div class="field"><label>Foto da galeria</label><input id="pImage" type="file" accept="image/*"></div>
 ${p?.image?`<img class="filePreview" src="${esc(p.image)}">`:""}<div class="actions"><button class="primary" onclick="savePerson('${p?.id||""}')">Salvar participante</button><button class="secondary" onclick="adminCast()">Cancelar</button></div></div>`;
}
function newPerson(){personForm(null)} function editPerson(id){personForm(current().cast.find(p=>p.id===id))}
async function savePerson(id){
 const e=current();const old=id?e.cast.find(p=>p.id===id):{id:uid()};const im=await fileToData(document.getElementById("pImage"));old.name=document.getElementById("pName").value.trim()||"Participante";old.role=document.getElementById("pRole").value.trim();old.status=document.getElementById("pStatus").value;if(im)old.image=im;if(!id)e.cast.push(old);save();render();toast("Participante salvo!");adminCast()
}
function deletePerson(id){if(!confirm("Excluir participante?"))return;current().cast=current().cast.filter(p=>p.id!==id);save();render();adminCast()}
function adminPosts(){
 const e=current();document.getElementById("adminBody").innerHTML=`<div class="actions"><button class="primary" onclick="newPost()">＋ Adicionar conteúdo</button></div><div style="margin-top:10px">${e.posts.map(p=>`<div class="listItem"><img class="thumb" src="${imgOrPlaceholder(p.image,p.type)}"><div class="liText"><b>${esc(p.title)}</b><small>${esc(p.type)}</small></div><button class="ghost" onclick="editPost('${p.id}')">Editar</button><button class="danger" onclick="deletePost('${p.id}')">Excluir</button></div>`).join("")||`<div class="empty">Nenhum conteúdo cadastrado.</div>`}</div>`;
}
function postForm(p){
 document.getElementById("adminBody").innerHTML=`<div class="form"><div class="row2"><div class="field"><label>Categoria</label><select id="cType">${["Paredão","Notícia","Resultado","Enquete","Acontecimento","Anúncio"].map(x=>`<option ${p?.type===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Data / semana</label><input id="cDate" value="${esc(p?.date||"")}"></div></div>
 <div class="field"><label>Título</label><input id="cTitle" value="${esc(p?.title||"")}"></div><div class="field"><label>Texto</label><textarea id="cText">${esc(p?.text||"")}</textarea></div>
 <div class="field"><label>Imagem da galeria</label><input id="cImage" type="file" accept="image/*"></div>${p?.image?`<img class="filePreview" src="${esc(p.image)}">`:""}
 <div class="field"><label>Link da votação (usado em Paredão)</label><input id="cVote" type="url" value="${esc(p?.voteUrl||"")}" placeholder="https://..."></div>
 <label class="check"><input id="cFeatured" type="checkbox" ${p?.featured?"checked":""}> Destacar este conteúdo no Portal</label>
 <div class="actions"><button class="primary" onclick="savePost('${p?.id||""}')">Salvar conteúdo</button><button class="secondary" onclick="adminPosts()">Cancelar</button></div></div>`;
}
function newPost(){postForm(null)} function editPost(id){postForm(current().posts.find(p=>p.id===id))}
async function savePost(id){
 const e=current();const old=id?e.posts.find(p=>p.id===id):{id:uid()};const im=await fileToData(document.getElementById("cImage"));
 old.type=document.getElementById("cType").value;old.date=document.getElementById("cDate").value.trim();old.title=document.getElementById("cTitle").value.trim()||"Sem título";old.text=document.getElementById("cText").value.trim();old.voteUrl=document.getElementById("cVote").value.trim();old.featured=document.getElementById("cFeatured").checked;if(im)old.image=im;
 if(!id)e.posts.unshift(old);save();render();toast("Conteúdo salvo!");adminPosts()
}
function deletePost(id){if(!confirm("Excluir publicação?"))return;current().posts=current().posts.filter(p=>p.id!==id);save();render();adminPosts()}
function adminLook(){
 const e=current();document.getElementById("adminBody").innerHTML=`<div class="form"><div class="notice">Aqui você ajusta a identidade visual da edição sem precisar mexer no código.</div>
 <div class="row2"><div class="field"><label>Cor principal</label><input id="lookA" class="colorPicker" type="color" value="${cssColor(e.accent)}"></div><div class="field"><label>Cor secundária</label><input id="lookB" class="colorPicker" type="color" value="${cssColor(e.accent2)}"></div></div>
 <div class="field"><label>Nome do portal</label><input id="lookName" value="${esc(data.siteName||"Portal Oficial")}"></div>
 <div class="field"><label>PIN do criador</label><input id="lookPin" type="password" placeholder="Novo PIN"></div>
 <div class="actions"><button class="primary" onclick="saveLook()">Salvar aparência</button></div></div>`;
}
function saveLook(){const e=current();e.accent=document.getElementById("lookA").value;e.accent2=document.getElementById("lookB").value;data.siteName=document.getElementById("lookName").value.trim()||"Portal Oficial";const pin=document.getElementById("lookPin").value.trim();if(pin)localStorage.setItem(PIN_KEY,pin);save();render();toast("Aparência atualizada!");adminLook()}
render();
</script>
</body>
</html>
