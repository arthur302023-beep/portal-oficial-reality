<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Oficial • Reality</title>
<style>
:root{--accent:#8b5cf6;--bg:#09090b;--panel:#121217;--panel2:#18181f;--text:#f7f7fb;--muted:#a1a1aa;--line:#27272f;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#23134a 0,transparent 35%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:#09090bee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1.5px}.hamb{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:10px 12px}
.hero{margin:22px 0;border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;min-height:330px;background:var(--panel)}
.hero img{width:100%;height:330px;object-fit:cover;display:block;opacity:.65}.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,#09090b 2%,transparent 65%)}.heroText{position:absolute;left:22px;right:22px;bottom:22px}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:1.2px}.hero h1{font-size:clamp(30px,7vw,60px);margin:5px 0}.hero p{max-width:700px;color:#ddd;margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;background:var(--accent);color:white}.btn.ghost{background:#ffffff0b;border:1px solid var(--line)}.btn.danger{background:#7f1d1d}.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}
.section{margin:28px 0}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.section h2{margin:0;font-size:21px}.sectionHead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.castShell{position:relative}.castTrack{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(145px,calc(25% - 9px));gap:12px;overflow:hidden;scroll-behavior:smooth;padding:2px}.castCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.castPhoto{height:185px;background:#202027}.castPhoto img{width:100%;height:100%;object-fit:cover}.castBody{padding:10px}.castName{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-flex;margin-top:5px;padding:4px 7px;border-radius:999px;background:#ffffff0b;color:#ddd;font-size:10px}.eliminated{filter:grayscale(1);opacity:.65}.arrow{position:absolute;top:80px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#111116eF;color:#fff;font-size:20px;z-index:3}.arrow.left{left:-5px}.arrow.right{right:-5px}.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}.dot{width:6px;height:6px;border-radius:50%;background:#444}.dot.active{width:18px;background:var(--accent);border-radius:9px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#ccc;border-radius:999px;padding:8px 12px}.filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.post{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.post img{width:100%;height:180px;object-fit:cover}.postBody{padding:13px}.postMeta{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase}.post h3{margin:5px 0;font-size:17px}.post p{margin:0;color:#aaa;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.menu{display:none;position:absolute;right:16px;top:58px;background:#15151b;border:1px solid var(--line);border-radius:15px;padding:8px;box-shadow:0 20px 60px #000}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px;border-radius:9px}.menu button:hover{background:#ffffff0b}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:22px;padding:18px}.box h2{margin-top:0}.close{float:right;border:0;background:#ffffff0b;color:#fff;border-radius:10px;padding:8px}
.form{display:grid;gap:10px}.form label{font-size:12px;color:#aaa}.form input,.form textarea,.form select{width:100%;background:#09090d;color:#fff;border:1px solid var(--line);border-radius:11px;padding:11px}.form textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.adminTabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.adminTabs button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#ccc;border-radius:10px;padding:8px 11px}.adminTabs button.active{background:var(--accent);color:#fff}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px}.itemActions{display:flex;gap:6px}.mini{padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:#ffffff08;color:#fff}.notice{padding:10px 12px;border-radius:12px;background:#172554;border:1px solid #1e3a8a;color:#bfdbfe;font-size:13px}.warn{background:#451a03;border-color:#78350f;color:#fed7aa}
footer{padding:35px 0 60px;color:#777;text-align:center;font-size:12px}
@media(max-width:700px){.posts{grid-template-columns:1fr}.castTrack{grid-auto-columns:calc(50% - 6px)}.hero,.hero img{min-height:300px;height:300px}.row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.stat b{font-size:18px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">PORTAL <span style="color:var(--accent)">REALITY</span><small>OFICIAL</small></div><button class="hamb" id="menuBtn">☰</button><div class="menu" id="menu"><button id="creatorBtn">🔐 Área do criador</button><button id="shareBtn">🔗 Compartilhar portal</button></div></div></header>
<main class="wrap">
<section class="hero" id="hero"></section>
<div class="stats" id="stats"></div>
<section class="section"><div class="sectionHead"><div><h2>🎭 Elenco</h2><p class="gallery-note">📸 Escolha a foto diretamente da galeria do celular. É opcional — não precisa colar URL.</p><p>Deslize ou use as setas para conhecer os participantes.</p></div></div><div class="castShell"><button class="arrow left" id="castPrev">‹</button><div class="castTrack" id="castTrack"></div><button class="arrow right" id="castNext">›</button></div><div class="dots" id="dots"></div></section>
<section class="section"><div class="sectionHead"><div><h2>📺 Conteúdos</h2><p>Notícias, paredões, resultados e acontecimentos da edição.</p></div></div><div class="filters" id="filters"></div><div class="posts" id="posts"></div></section>
<footer>Portal Oficial Reality • conteúdo da edição</footer>
</main>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,collection,doc,getDocs,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBYLyvwUBKdD2yubykYzQ1w1oVTFveAJMU",authDomain:"reality-gacha-votacao-acb28.firebaseapp.com",projectId:"reality-gacha-votacao-acb28",storageBucket:"reality-gacha-votacao-acb28.firebasestorage.app",messagingSenderId:"304393731037",appId:"1:304393731037:web:f36aa225701281402d5434"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const TYPES=[["all","Todos"],["paredao","Paredão"],["noticia","Notícia"],["resultado","Resultado"],["enquete","Enquete"],["acontecimento","Acontecimento"],["anuncio","Anúncio"]];
const DEFAULT={id:"main",name:"Reality",year:"1ª Edição",description:"Bem-vindo ao Portal Oficial.",cover:"",voteUrl:"",accent:"#8b5cf6"};
let data={edition:DEFAULT,cast:[],posts:[]},filter="all",creatorEmail="";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function applyTheme(){document.documentElement.style.setProperty("--accent",data.edition.accent||"#8b5cf6")}
function imgOrBlank(src,alt=""){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:""}
async function loadData(){
 try{
  const e=await getDoc(doc(db,"portal","edition")); if(e.exists()) data.edition={...DEFAULT,...e.data()};
  const cs=await getDocs(collection(db,"portal","cast")); data.cast=cs.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  const ps=await getDocs(collection(db,"portal","posts")); data.posts=ps.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 }catch(e){console.error(e);toast("Não foi possível carregar os dados agora.");}
 applyTheme();render();
}
function render(){
 const e=data.edition;
 $("#hero").innerHTML=`${imgOrBlank(e.cover,e.name)}<div class="shade"></div><div class="heroText"><div class="eyebrow">${esc(e.year)}</div><h1>${esc(e.name)}</h1><p>${esc(e.description||"")}</p><div class="actions">${e.voteUrl?`<button class="btn" onclick="location.href='${esc(e.voteUrl)}'">🗳️ Votar</button>`:""}<button class="btn ghost" id="shareHero">🔗 Compartilhar</button></div></div>`;
 $("#stats").innerHTML=`<div class="stat"><b>${data.cast.length}</b><span>participantes</span></div><div class="stat"><b>${data.posts.length}</b><span>conteúdos</span></div><div class="stat"><b>${data.posts.filter(p=>p.type==="paredao").length}</b><span>paredões</span></div>`;
 renderCast();renderFilters();renderPosts();$("#shareHero").onclick=share;
}
function renderCast(){
 const t=$("#castTrack");t.innerHTML=data.cast.length?data.cast.map(p=>`<article class="castCard ${p.status==="Eliminado"?"eliminated":""}"><div class="castPhoto">${imgOrBlank(p.photo,p.name)}</div><div class="castBody"><div class="castName">${esc(p.name)}</div><span class="tag">${esc(p.role||p.status||"No jogo")}</span></div></article>`).join(""):`<div class="empty">O elenco ainda não foi cadastrado.</div>`;
 const pages=Math.max(1,Math.ceil(data.cast.length/4));$("#dots").innerHTML=Array.from({length:pages},(_,i)=>`<i class="dot ${i===0?"active":""}"></i>`).join("");
 t.onscroll=()=>{const page=Math.round(t.scrollLeft/(t.clientWidth||1));[...$("#dots").children].forEach((d,i)=>d.classList.toggle("active",i===page))};
}
function renderFilters(){$("#filters").innerHTML=TYPES.map(([v,n])=>`<button class="filter ${filter===v?"active":""}" data-f="${v}">${n}</button>`).join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();renderPosts()})}
function renderPosts(){
 const ps=filter==="all"?data.posts:data.posts.filter(p=>p.type===filter);
 $("#posts").innerHTML=ps.length?ps.map(p=>`<article class="post" data-post="${p.id}">${p.image?imgOrBlank(p.image,p.title):""}<div class="postBody"><div class="postMeta">${esc(TYPES.find(x=>x[0]===p.type)?.[1]||p.type)}</div><h3>${esc(p.title)}</h3><p>${esc(p.text||"")}</p></div></article>`).join(""):`<div class="empty">Nenhum conteúdo nessa categoria ainda.</div>`;
 document.querySelectorAll("[data-post]").forEach(x=>x.onclick=()=>openPost(x.dataset.post));
}
function openPost(id){const p=data.posts.find(x=>x.id===id);if(!p)return;$("#modalBox").innerHTML=`<button class="close" onclick="closeModal()">✕</button>${p.image?imgOrBlank(p.image,p.title):""}<div class="postBody"><div class="postMeta">${esc(TYPES.find(x=>x[0]===p.type)?.[1]||p.type)}</div><h2>${esc(p.title)}</h2><p style="white-space:pre-wrap;color:#bbb">${esc(p.text||"")}</p>${p.voteUrl?`<button class="btn" onclick="location.href='${esc(p.voteUrl)}'">🗳️ Abrir votação</button>`:""}</div>`;$("#modal").classList.add("show")}
window.closeModal=()=>$("#modal").classList.remove("show");
$("#castPrev").onclick=()=>$("#castTrack").scrollBy({left:-$("#castTrack").clientWidth,behavior:"smooth"});
$("#castNext").onclick=()=>$("#castTrack").scrollBy({left:$("#castTrack").clientWidth,behavior:"smooth"});
$("#menuBtn").onclick=()=>$("#menu").classList.toggle("open");
$("#shareBtn").onclick=share;
$("#creatorBtn").onclick=creatorLogin;
async function share(){if(navigator.share)try{await navigator.share({title:data.edition.name,url:location.href});}catch{}else{await navigator.clipboard?.writeText(location.href);toast("Link copiado!");}}
function toast(t){const x=document.createElement("div");x.textContent=t;x.style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;background:#18181f;border:1px solid #333;padding:11px 15px;border-radius:12px";document.body.append(x);setTimeout(()=>x.remove(),2200)}
function creatorLogin(){if(auth.currentUser){openAdmin();return}$("#modalBox").innerHTML=`<button class="close" onclick="closeModal()">✕</button><h2>🔐 Área do criador</h2><p style="color:#aaa">Entre com o e-mail e a senha do usuário de criador configurado no Firebase. A senha nunca é exibida no portal.</p><div class="form"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"><button class="btn" id="loginGo">Entrar</button><div class="notice">Visitantes não têm acesso ao painel. Para a proteção funcionar de verdade, o usuário de criador precisa estar autorizado nas regras do Firestore.</div></div>`;$("#modal").classList.add("show");$("#loginGo").onclick=async()=>{try{creatorEmail=$("#loginEmail").value.trim();await signInWithEmailAndPassword(auth,creatorEmail,$("#loginPass").value);closeModal();openAdmin()}catch(e){toast("E-mail ou senha inválidos.")}}}
function openAdmin(){const e=data.edition;$("#modalBox").innerHTML=`<button class="close" onclick="closeModal()">✕</button><h2>⚙️ Painel do criador</h2><div class="notice">Você está logado. As alterações são salvas no Firebase e ficam disponíveis para quem abrir o Portal.</div><div class="adminTabs"><button class="active" data-tab="edition">Edição</button><button data-tab="cast">Elenco</button><button data-tab="posts">Conteúdos</button></div><div id="adminArea"></div>`;$("#modal").classList.add("show");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");adminTab(b.dataset.tab)});adminTab("edition")}
function adminTab(tab){if(tab==="edition")adminEdition();if(tab==="cast")adminCast();if(tab==="posts")adminPosts()}
function adminEdition(){$("#adminArea").innerHTML=`<div class="form"><div class="row"><div><label>Nome da edição</label><input id="eName" value="${esc(data.edition.name)}"></div><div><label>Ano / temporada</label><input id="eYear" value="${esc(data.edition.year)}"></div></div><label>Descrição</label><textarea id="eDesc">${esc(data.edition.description)}</textarea><div class="row"><div><label>Cor principal</label><input id="eColor" type="color" value="${data.edition.accent||"#8b5cf6"}"></div><div><label>URL da votação geral</label><input id="eVote" value="${esc(data.edition.voteUrl||"")}"></div></div><label>Imagem da capa (URL)</label><input id="eCover" value="${esc(data.edition.cover||"")}"><button class="btn" id="saveEdition">Salvar edição</button><button class="mini" id="logout">Sair da conta</button></div>`;$("#saveEdition").onclick=saveEdition;$("#logout").onclick=async()=>{await signOut(auth);closeModal();toast("Sessão encerrada.")}}
async function saveEdition(){data.edition={...data.edition,name:$("#eName").value.trim()||"Reality",year:$("#eYear").value.trim(),description:$("#eDesc").value.trim(),accent:$("#eColor").value,voteUrl:$("#eVote").value.trim(),cover:$("#eCover").value.trim()};await setDoc(doc(db,"portal","edition"),data.edition);applyTheme();render();toast("Edição salva!")}
function adminCast(){const area=$("#adminArea");area.innerHTML=`<div class="actions"><button class="btn" id="newCast">+ Participante</button></div><div class="list" id="castList"></div>`;area.querySelector("#newCast").onclick=()=>castForm();area.querySelector("#castList").innerHTML=data.cast.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div style="color:#999;font-size:12px">${esc(p.status||"No jogo")}</div></div><div class="itemActions"><button class="mini" data-edit="${p.id}">Editar</button><button class="mini" data-del="${p.id}">Excluir</button></div></div>`).join("")||`<div class="empty">Nenhum participante.</div>`;area.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>castForm(data.cast.find(p=>p.id===b.dataset.edit)));area.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteCast(b.dataset.del))}
function castForm(p={name:"",role:"",status:"No jogo",photo:""}){$("#adminArea").innerHTML=`<div class="form"><h3>${p.id?"Editar":"Novo"} participante</h3><label>Nome</label><input id="cName" value="${esc(p.name)}"><div class="row"><div><label>Função/destaque</label><input id="cRole" value="${esc(p.role)}"></div><div><label>Status</label><select id="cStatus"><option ${p.status==="No jogo"?"selected":""}>No jogo</option><option ${p.status==="Eliminado"?"selected":""}>Eliminado</option></select></div></div><label>Foto (Foto do participante (opcional))</label><input id="cPhoto" value="${esc(p.photo)}"><div class="notice">Nesta versão segura, a imagem pode ser hospedada em um serviço público e colada aqui. Upload direto de galeria exige Storage/configuração adicional.</div><button class="btn" id="saveCast">${p.id?"Salvar":"Adicionar"}</button><button class="mini" id="backCast">Voltar</button></div>`;$("#saveCast").onclick=async()=>{const obj={name:$("#cName").value.trim(),role:$("#cRole").value.trim(),status:$("#cStatus").value,photo:$("#cPhoto").value.trim(),order:p.order??data.cast.length};if(!obj.name)return toast("Digite o nome.");if(p.id)await updateDoc(doc(db,"portal","cast",p.id),obj);else await addDoc(collection(db,"portal","cast"),obj);await loadData();adminCast()};$("#backCast").onclick=adminCast}
async function deleteCast(id){if(confirm("Excluir participante?")){await deleteDoc(doc(db,"portal","cast",id));await loadData();adminCast()}}
function adminPosts(){const area=$("#adminArea");area.innerHTML=`<div class="actions"><button class="btn" id="newPost">+ Conteúdo</button></div><div class="list" id="postList"></div>`;area.querySelector("#newPost").onclick=()=>postForm();area.querySelector("#postList").innerHTML=data.posts.map(p=>`<div class="item"><div><b>${esc(p.title)}</b><div style="color:#999;font-size:12px">${esc(TYPES.find(x=>x[0]===p.type)?.[1]||p.type)}</div></div><div class="itemActions"><button class="mini" data-edit="${p.id}">Editar</button><button class="mini" data-del="${p.id}">Excluir</button></div></div>`).join("")||`<div class="empty">Nenhum conteúdo.</div>`;area.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>postForm(data.posts.find(p=>p.id===b.dataset.edit)));area.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deletePost(b.dataset.del))}
function postForm(p={type:"noticia",title:"",text:"",image:"",voteUrl:""}){$("#adminArea").innerHTML=`<div class="form"><h3>${p.id?"Editar":"Novo"} conteúdo</h3><label>Categoria</label><select id="pType">${TYPES.filter(x=>x[0]!=="all").map(x=>`<option value="${x[0]}" ${p.type===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><label>Título</label><input id="pTitle" value="${esc(p.title)}"><label>Texto</label><textarea id="pText">${esc(p.text)}</textarea><label>Imagem (URL)</label><input id="pImage" value="${esc(p.image||"")}"><label>Link de votação (opcional)</label><input id="pVote" value="${esc(p.voteUrl||"")}"><button class="btn" id="savePost">${p.id?"Salvar":"Publicar"}</button><button class="mini" id="backPost">Voltar</button></div>`;$("#savePost").onclick=async()=>{const obj={type:$("#pType").value,title:$("#pTitle").value.trim(),text:$("#pText").value.trim(),image:$("#pImage").value.trim(),voteUrl:$("#pVote").value.trim(),createdAt:p.createdAt||Date.now()};if(!obj.title)return toast("Digite um título.");if(p.id)await updateDoc(doc(db,"portal","posts",p.id),obj);else await addDoc(collection(db,"portal","posts"),obj);await loadData();adminPosts()};$("#backPost").onclick=adminPosts}
async function deletePost(id){if(confirm("Excluir conteúdo?")){await deleteDoc(doc(db,"portal","posts",id));await loadData();adminPosts()}}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
onAuthStateChanged(auth,()=>{});
loadData();
</script>

<script>
/* V4 — imagens dos participantes escolhidas diretamente da galeria */
function escolherFotoParticipante(input, previewId, hiddenId) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("Escolha uma imagem.");
    input.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const hidden = document.getElementById(hiddenId);
    if (hidden) hidden.value = reader.result;
    const preview = document.getElementById(previewId);
    if (preview) preview.src = reader.result;
  };
  reader.readAsDataURL(file);
}
</script>

</body></html>
